# CI เริ่มหลัง push หรือเปิด PR โดย Vercel รัน check:release ชุดเดียวกันใน build ของตัวเองก่อนเผยแพร่
# Playwright ตรวจพฤติกรรมใน browser แยกจาก build ของ Vercel
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:release
      - run: npx playwright install --with-deps webkit firefox
      - run: npm run test:smoke
