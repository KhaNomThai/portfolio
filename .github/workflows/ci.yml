# CI เริ่มหลัง push หรือเปิด PR ส่วน Vercel รัน check:release ใน build ของตัวเอง
# Deployment Checks ของ Vercel รอ job ชื่อ `check` นี้ผ่านก่อนขึ้น kulac.dev: เปลี่ยนชื่อ job ต้องไปเลือกใหม่ใน Vercel
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:release
      - run: npx playwright install --with-deps webkit firefox
      - run: npm run test:smoke
