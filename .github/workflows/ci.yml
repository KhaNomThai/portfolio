# ด่านก่อนขึ้นเว็บจริง: Vercel deploy ทุก push เข้า main ทันที ถ้า workflow นี้แดงให้แก้ก่อน
# check:tokens, check:data และ cv --check อยู่ในนี้เพราะสิ่งที่มันจับไม่ทำให้ lint/build พัง แต่ทำให้เว็บหรือ CV แสดงผิด
# cv --check เทียบแค่ hash จึงไม่ต้องมี Chrome บน runner
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:tokens
      - run: npm run check:data
      - run: npm run cv -- --check
      - run: npm run build
